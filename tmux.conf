set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

run '~/.tmux/plugins/tpm/tpm'

set -g default-terminal "tmux-256color"

set -g prefix C-q
unbind-key C-b
bind-key C-q send-prefix

setw -g mode-keys vi

set-hook -g pane-focus-out 'select-pane -P bg=color236,fg=default'
set-hook -g pane-focus-in 'select-pane -P bg=default,fg=default'
set -g pane-active-border-style "bg=default,fg=white"
set -g pane-border-style "bg=default,fg=white"

# tmux 2.4 and later
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

## tmux <2.4
#bind-key -t vi-copy 'v' begin-selection     # Begin selection in copy mode.
#bind-key -t vi-copy 'C-v' rectangle-toggle  # Begin selection in copy mode.
#bind-key -t vi-copy 'y' copy-selection      # Yank selection in copy mode.

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind '/' split-window -h -c "#{pane_current_path}"
bind '.' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind '%'

set -g status-style 'bg=default bold'
set -g status-fg green

set -g message-style 'fg=yellow bg=default bold'
